<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 345" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="730" height="345" fill="#ffffff"/>

  <!-- time arrow -->
  <line x1="150" y1="22" x2="668" y2="22" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="676" y="26" font-size="11" fill="#999">time</text>

  <!-- ================= Forward ================= -->
  <text x="14" y="46" font-size="13" font-weight="600" fill="#333">Forward</text>
  <text x="14" y="62" font-size="10.5" fill="#777">source to destination</text>
  <line x1="150" y1="55" x2="660" y2="55" stroke="#ddd" stroke-width="1"/>

  <rect x="164" y="43" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="278" y="43" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="430" y="43" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="620" y="43" width="10" height="24" rx="2" fill="#4C72B0"/>

  <line x1="174" y1="80" x2="278" y2="80" stroke="#4C72B0" stroke-width="1.4" marker-start="url(#tB)" marker-end="url(#tB)"/>
  <line x1="288" y1="80" x2="430" y2="80" stroke="#4C72B0" stroke-width="1.4" marker-start="url(#tB)" marker-end="url(#tB)"/>
  <line x1="440" y1="80" x2="620" y2="80" stroke="#4C72B0" stroke-width="1.4" marker-start="url(#tB)" marker-end="url(#tB)"/>
  <text x="397" y="99" font-size="11.5" fill="#4C72B0" text-anchor="middle">3 forward inter-arrival times (fiat)</text>

  <!-- ================= Backward ================= -->
  <text x="14" y="152" font-size="13" font-weight="600" fill="#333">Backward</text>
  <text x="14" y="168" font-size="10.5" fill="#777">destination to source</text>
  <line x1="150" y1="161" x2="660" y2="161" stroke="#ddd" stroke-width="1"/>

  <rect x="240" y="149" width="10" height="24" rx="2" fill="#DD8452"/>
  <rect x="468" y="149" width="10" height="24" rx="2" fill="#DD8452"/>
  <rect x="644" y="149" width="10" height="24" rx="2" fill="#DD8452"/>

  <line x1="250" y1="186" x2="468" y2="186" stroke="#DD8452" stroke-width="1.4" marker-start="url(#tO)" marker-end="url(#tO)"/>
  <line x1="478" y1="186" x2="644" y2="186" stroke="#DD8452" stroke-width="1.4" marker-start="url(#tO)" marker-end="url(#tO)"/>
  <text x="447" y="205" font-size="11.5" fill="#DD8452" text-anchor="middle">2 backward inter-arrival times (biat)</text>

  <!-- ================= Combined ================= -->
  <text x="14" y="258" font-size="13" font-weight="600" fill="#333">Combined</text>
  <text x="14" y="274" font-size="10.5" fill="#777">either direction</text>
  <line x1="150" y1="267" x2="660" y2="267" stroke="#ddd" stroke-width="1"/>

  <rect x="164" y="255" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="240" y="255" width="10" height="24" rx="2" fill="#DD8452"/>
  <rect x="278" y="255" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="430" y="255" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="468" y="255" width="10" height="24" rx="2" fill="#DD8452"/>
  <rect x="620" y="255" width="10" height="24" rx="2" fill="#4C72B0"/>
  <rect x="644" y="255" width="10" height="24" rx="2" fill="#DD8452"/>

  <line x1="174" y1="292" x2="240" y2="292" stroke="#666" stroke-width="1.4" marker-start="url(#tG)" marker-end="url(#tG)"/>
  <line x1="250" y1="292" x2="278" y2="292" stroke="#666" stroke-width="1.4" marker-start="url(#tG)" marker-end="url(#tG)"/>
  <line x1="288" y1="292" x2="430" y2="292" stroke="#666" stroke-width="1.4" marker-start="url(#tG)" marker-end="url(#tG)"/>
  <line x1="440" y1="292" x2="468" y2="292" stroke="#666" stroke-width="1.4" marker-start="url(#tG)" marker-end="url(#tG)"/>
  <line x1="478" y1="292" x2="620" y2="292" stroke="#666" stroke-width="1.4" marker-start="url(#tG)" marker-end="url(#tG)"/>
  <line x1="630" y1="292" x2="644" y2="292" stroke="#666" stroke-width="1.4" marker-start="url(#tG)" marker-end="url(#tG)"/>
  <text x="409" y="311" font-size="11.5" fill="#666" text-anchor="middle">6 flow inter-arrival times (flowiat)</text>

  <text x="365" y="336" font-size="11" fill="#888" text-anchor="middle">
    The same seven packets. Each group records the minimum, mean and maximum of its own intervals.
  </text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#999"/></marker>
    <marker id="tB" markerWidth="4" markerHeight="10" refX="2" refY="5" orient="auto"><line x1="2" y1="1" x2="2" y2="9" stroke="#4C72B0" stroke-width="1.4"/></marker>
    <marker id="tO" markerWidth="4" markerHeight="10" refX="2" refY="5" orient="auto"><line x1="2" y1="1" x2="2" y2="9" stroke="#DD8452" stroke-width="1.4"/></marker>
    <marker id="tG" markerWidth="4" markerHeight="10" refX="2" refY="5" orient="auto"><line x1="2" y1="1" x2="2" y2="9" stroke="#666" stroke-width="1.4"/></marker>
  </defs>
</svg>
