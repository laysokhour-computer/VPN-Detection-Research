<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="700" height="392" fill="#ffffff"/>

  <!-- ============ 1. Cleaned dataset ============ -->
  <text x="60" y="26" font-size="12" font-weight="600" fill="#333">Cleaned dataset</text>
  <rect x="60" y="34" width="580" height="30" rx="3" fill="#c9d6e8" stroke="#9fb4d0"/>
  <text x="350" y="54" font-size="12" fill="#333" text-anchor="middle">18,036 flows &#183; 51.8% VPN</text>

  <line x1="350" y1="68" x2="350" y2="88" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ 2. 80/20 split ============ -->
  <text x="60" y="108" font-size="12" font-weight="600" fill="#333">Stratified 80:20 split</text>

  <rect x="60" y="116" width="464" height="36" rx="3" fill="#4C72B0"/>
  <text x="292" y="133" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Training</text>
  <text x="292" y="147" font-size="10.5" fill="#dde8f5" text-anchor="middle">14,428 flows</text>

  <rect x="532" y="116" width="108" height="36" rx="3" fill="#DD8452"/>
  <text x="586" y="133" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Test</text>
  <text x="586" y="147" font-size="10.5" fill="#fdeee5" text-anchor="middle">3,608 flows</text>

  <line x1="292" y1="156" x2="292" y2="176" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ============ 3. Five-fold CV ============ -->
  <text x="60" y="196" font-size="12" font-weight="600" fill="#333">Five-fold cross-validation, within the training set only</text>

  <!-- Round 1 -->
  <text x="52" y="219" font-size="10" fill="#888" text-anchor="end">1</text>
  <rect x="60"  y="206" width="89" height="22" rx="2" fill="#4C72B0"/>
  <rect x="154" y="206" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="248" y="206" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="342" y="206" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="436" y="206" width="88" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <text x="104" y="221" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">score</text>

  <!-- Round 2 -->
  <text x="52" y="247" font-size="10" fill="#888" text-anchor="end">2</text>
  <rect x="60"  y="234" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="154" y="234" width="89" height="22" rx="2" fill="#4C72B0"/>
  <rect x="248" y="234" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="342" y="234" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="436" y="234" width="88" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <text x="198" y="249" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">score</text>

  <!-- Round 3 -->
  <text x="52" y="275" font-size="10" fill="#888" text-anchor="end">3</text>
  <rect x="60"  y="262" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="154" y="262" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="248" y="262" width="89" height="22" rx="2" fill="#4C72B0"/>
  <rect x="342" y="262" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="436" y="262" width="88" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <text x="292" y="277" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">score</text>

  <!-- Round 4 -->
  <text x="52" y="303" font-size="10" fill="#888" text-anchor="end">4</text>
  <rect x="60"  y="290" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="154" y="290" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="248" y="290" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="342" y="290" width="89" height="22" rx="2" fill="#4C72B0"/>
  <rect x="436" y="290" width="88" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <text x="386" y="305" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">score</text>

  <!-- Round 5 -->
  <text x="52" y="331" font-size="10" fill="#888" text-anchor="end">5</text>
  <rect x="60"  y="318" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="154" y="318" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="248" y="318" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="342" y="318" width="89" height="22" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <rect x="436" y="318" width="88" height="22" rx="2" fill="#4C72B0"/>
  <text x="480" y="333" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">score</text>

  <!-- Test set set aside -->
  <rect x="532" y="206" width="108" height="134" rx="3" fill="#fbe9de" stroke="#DD8452" stroke-dasharray="4 3"/>
  <text x="586" y="266" font-size="11" fill="#b35f2e" text-anchor="middle" font-weight="600">set aside</text>
  <text x="586" y="282" font-size="11" fill="#b35f2e" text-anchor="middle" font-weight="600">until 5.2.3</text>

  <!-- Legend -->
  <rect x="60" y="356" width="12" height="12" rx="2" fill="#4C72B0"/>
  <text x="78" y="366" font-size="10.5" fill="#666">scored in that round</text>

  <rect x="212" y="356" width="12" height="12" rx="2" fill="#c9d6e8" stroke="#9fb4d0"/>
  <text x="230" y="366" font-size="10.5" fill="#666">used to fit the model</text>

  <text x="60" y="386" font-size="10.5" fill="#999">Sixty hyperparameter configurations were compared using these five rounds.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#999"/></marker>
  </defs>
</svg>
